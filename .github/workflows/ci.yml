name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]   # build/test tooling (tsdown, Vitest) needs Node >= 22; the library itself also runs on Node 20 (see "runtimes")
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test -w solana-payments-webhooks -- --coverage
      - name: Package checks (publint + are-the-types-wrong)
        run: npm run check:package -w solana-payments-webhooks

  runtimes:
    name: Runtime smoke tests (Node 20, Bun, Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Node 20 (built package, ESM + CJS)
        run: |
          node --version
          node packages/js/scripts/runtime-smoke.mjs
          node -e "const l=require('./packages/js/dist/index.cjs'); if(typeof l.verifyWebhook!=='function'||typeof l.checkPayment!=='function') process.exit(1); console.log('[node20 cjs] ok')"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
      - name: Bun
        run: bun packages/js/scripts/runtime-smoke.mjs
      - name: Deno
        run: deno run --allow-read packages/js/scripts/runtime-smoke.mjs

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: ruff check src tests && ruff format --check src tests
      - run: mypy
      - run: pytest -q
